services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payledger
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: payledger
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # set POSTGRES_PORT if 5432 is taken by a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payledger -d payledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
