spring:
  application:
    name: payledger
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payledger}
    username: ${SPRING_DATASOURCE_USERNAME:payledger}
    password: ${SPRING_DATASOURCE_PASSWORD:payledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

payledger:
  jwt:
    # Required, at least 32 bytes. No default on purpose: the app refuses to start without it.
    secret: ${JWT_SECRET}
    ttl: PT1H
